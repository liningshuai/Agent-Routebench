[package]
name = "agent-routebench"
version = "0.1.0"
description = "Agent Routebench Tauri native host shell"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "agent_routebench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
