<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Agent Workbench desktop UI preview" />
    <title>Agent Workbench · Desktop UI Preview</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f4f5f7;
        --sidebar: #f8f9fb;
        --surface: #ffffff;
        --surface-soft: #f7f8fa;
        --surface-muted: #eef0f3;
        --ink: #202124;
        --ink-strong: #17181a;
        --ink-muted: #70747c;
        --ink-faint: #9ba0a8;
        --line: #e3e6ea;
        --line-strong: #d6d9de;
        --accent: #2f6fed;
        --accent-soft: #eaf1ff;
        --accent-ink: #2257bd;
        --success: #2f8a5b;
        --success-soft: #e8f5ed;
        --warning: #a66b16;
        --shadow: 0 16px 42px rgba(26, 31, 39, 0.08);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        min-width: 860px;
        overflow: hidden;
        color: var(--ink);
        background: var(--canvas);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(47, 111, 237, 0.22);
        outline-offset: 2px;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 272px minmax(0, 1fr);
        height: 100%;
      }

      .app-sidebar {
        display: flex;
        min-width: 0;
        flex-direction: column;
        padding: 18px 12px 14px;
        border-right: 1px solid var(--line);
        background: var(--sidebar);
      }

      .brand-row,
      .workspace-row,
      .sidebar-footer,
      .main-header,
      .composer-toolbar,
      .status-bar,
      .project-heading,
      .message-heading {
        display: flex;
        align-items: center;
      }

      .brand-row {
        gap: 10px;
        padding: 0 8px 18px;
      }

      .brand-mark {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid #d8dee8;
        border-radius: 9px;
        color: var(--accent);
        background: #ffffff;
        box-shadow: 0 2px 7px rgba(35, 53, 79, 0.08);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      .brand-name {
        color: var(--ink-strong);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .brand-caption {
        margin-top: 2px;
        color: var(--ink-faint);
        font-size: 11px;
      }

      .workspace-row {
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 16px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
      }

      .workspace-label {
        overflow: hidden;
        color: var(--ink-strong);
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .workspace-branch {
        margin-top: 3px;
        color: var(--ink-muted);
        font-size: 11px;
      }

      .chevron {
        color: var(--ink-faint);
        font-size: 16px;
        line-height: 1;
      }

      .new-task {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 38px;
        margin-bottom: 18px;
        border: 1px solid var(--accent);
        border-radius: 9px;
        color: #ffffff;
        background: var(--accent);
        box-shadow: 0 5px 12px rgba(47, 111, 237, 0.16);
        font-weight: 700;
        transition: transform 180ms var(--ease-out), box-shadow 180ms var(--ease-out);
      }

      .new-task:active,
      .icon-button:active,
      .send-button:active,
      .cancel-button:active {
        transform: scale(0.97);
      }

      .new-task:hover {
        box-shadow: 0 8px 18px rgba(47, 111, 237, 0.22);
      }

      .plus {
        font-size: 18px;
        font-weight: 400;
        line-height: 1;
      }

      .sidebar-section-label {
        padding: 0 8px 8px;
        color: var(--ink-faint);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .session-list {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding-right: 2px;
        scrollbar-width: thin;
      }

      .project-group + .project-group {
        margin-top: 18px;
      }

      .project-heading {
        gap: 8px;
        padding: 0 8px 6px;
        color: var(--ink-strong);
        font-size: 12px;
        font-weight: 700;
      }

      .project-dot {
        width: 8px;
        height: 8px;
        border-radius: 3px;
        background: var(--accent);
      }

      .project-dot.green {
        background: #49a36d;
      }

      .project-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .project-branch {
        margin-left: auto;
        color: var(--ink-faint);
        font-size: 10px;
        font-weight: 500;
      }

      .session-item {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        gap: 7px;
        width: 100%;
        padding: 9px 8px 9px 10px;
        border-left: 2px solid transparent;
        border-radius: 8px;
        color: var(--ink-muted);
        background: transparent;
        text-align: left;
        transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out),
          border-color 150ms var(--ease-out);
      }

      .session-item:hover {
        color: var(--ink);
        background: #eef2f7;
      }

      .session-item.active {
        border-left-color: var(--accent);
        color: var(--ink-strong);
        background: var(--accent-soft);
      }

      .session-icon {
        margin-top: 1px;
        color: currentColor;
        font-size: 13px;
        opacity: 0.72;
      }

      .session-title {
        overflow: hidden;
        font-size: 12px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-meta {
        display: block;
        margin-top: 3px;
        color: var(--ink-faint);
        font-size: 10px;
      }

      .sidebar-footer {
        gap: 9px;
        margin-top: 14px;
        padding: 12px 8px 0;
        border-top: 1px solid var(--line);
      }

      .runtime-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4aaa70;
        box-shadow: 0 0 0 3px #dff2e6;
      }

      .runtime-label {
        color: var(--ink-muted);
        font-size: 11px;
      }

      .runtime-label strong {
        display: block;
        margin-bottom: 2px;
        color: var(--ink);
        font-size: 11px;
        font-weight: 650;
      }

      .profile {
        display: grid;
        width: 28px;
        height: 28px;
        margin-left: auto;
        place-items: center;
        border-radius: 50%;
        color: #31588e;
        background: #dce8f8;
        font-size: 11px;
        font-weight: 750;
      }

      .main-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-width: 0;
        background: var(--surface);
      }

      .main-header {
        justify-content: space-between;
        min-height: 70px;
        padding: 14px 28px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
      }

      .header-title {
        margin: 0;
        color: var(--ink-strong);
        font-size: 16px;
        font-weight: 720;
        letter-spacing: -0.025em;
      }

      .header-subtitle {
        margin-top: 4px;
        color: var(--ink-muted);
        font-size: 11px;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 0 9px;
        border: 1px solid #d4eadb;
        border-radius: 999px;
        color: var(--success);
        background: var(--success-soft);
        font-size: 11px;
        font-weight: 650;
      }

      .status-chip .runtime-dot {
        width: 6px;
        height: 6px;
        box-shadow: none;
      }

      .icon-button {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink-muted);
        background: var(--surface);
        transition: transform 180ms var(--ease-out), background-color 150ms var(--ease-out);
      }

      .icon-button:hover {
        background: var(--surface-soft);
      }

      .conversation {
        min-height: 0;
        overflow: auto;
        padding: 26px clamp(20px, 7vw, 120px) 30px;
        scrollbar-width: thin;
      }

      .conversation-inner {
        width: min(760px, 100%);
        margin: 0 auto;
      }

      .day-label {
        margin: 0 0 22px;
        color: var(--ink-faint);
        font-size: 11px;
        text-align: center;
      }

      .message {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 12px;
        margin-bottom: 25px;
      }

      .message-avatar {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: var(--ink-muted);
        background: var(--surface-soft);
        font-size: 11px;
        font-weight: 750;
      }

      .message.user .message-avatar {
        border-color: #d8e4f8;
        color: var(--accent-ink);
        background: #eef4ff;
      }

      .message.assistant .message-avatar {
        border-color: #d4eadb;
        color: var(--success);
        background: var(--success-soft);
      }

      .message-heading {
        min-height: 28px;
        gap: 8px;
      }

      .message-author {
        color: var(--ink-strong);
        font-size: 12px;
        font-weight: 700;
      }

      .message-time {
        color: var(--ink-faint);
        font-size: 10px;
      }

      .message-body {
        padding-top: 5px;
        color: #454950;
        font-size: 13px;
        line-height: 1.7;
      }

      .message-body p {
        margin: 0;
      }

      .message-body p + p {
        margin-top: 10px;
      }

      .check-list {
        display: grid;
        gap: 7px;
        margin: 13px 0 0;
        padding: 0;
        list-style: none;
      }

      .check-list li {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .check {
        display: grid;
        flex: 0 0 auto;
        width: 17px;
        height: 17px;
        margin-top: 2px;
        place-items: center;
        border-radius: 5px;
        color: var(--success);
        background: var(--success-soft);
        font-size: 11px;
        font-weight: 800;
      }

      .tool-card {
        margin-top: 15px;
        padding: 12px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-soft);
      }

      .tool-card summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        color: var(--ink);
        font-size: 11px;
        font-weight: 700;
        list-style: none;
      }

      .tool-card summary::-webkit-details-marker {
        display: none;
      }

      .tool-card summary::after {
        content: "⌄";
        color: var(--ink-faint);
        font-size: 15px;
        transition: transform 180ms var(--ease-out);
      }

      .tool-card[open] summary::after {
        transform: rotate(180deg);
      }

      .tool-status {
        color: var(--success);
        font-size: 10px;
        font-weight: 650;
      }

      .tool-rows {
        display: grid;
        gap: 8px;
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--line);
      }

      .tool-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        color: var(--ink-muted);
        font-size: 11px;
      }

      .tool-row strong {
        color: var(--ink);
        font-weight: 600;
      }

      .composer-wrap {
        padding: 0 28px 16px;
        background: var(--surface);
      }

      .composer {
        width: min(760px, 100%);
        margin: 0 auto;
        border: 1px solid var(--line-strong);
        border-radius: 13px;
        background: var(--surface);
        box-shadow: 0 7px 20px rgba(32, 36, 44, 0.06);
        transition: border-color 180ms var(--ease-out), box-shadow 180ms var(--ease-out);
      }

      .composer:focus-within {
        border-color: #a8c2f5;
        box-shadow: 0 8px 24px rgba(47, 111, 237, 0.11);
      }

      .composer textarea {
        display: block;
        width: 100%;
        min-height: 64px;
        max-height: 150px;
        padding: 14px 15px 8px;
        resize: vertical;
        border: 0;
        border-radius: 13px 13px 0 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font-size: 13px;
        line-height: 1.5;
      }

      .composer textarea::placeholder {
        color: var(--ink-faint);
      }

      .composer-toolbar {
        justify-content: space-between;
        padding: 8px 10px 10px 14px;
      }

      .composer-hint {
        color: var(--ink-faint);
        font-size: 10px;
      }

      .composer-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .cancel-button,
      .send-button {
        min-height: 30px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        transition: transform 180ms var(--ease-out), background-color 150ms var(--ease-out),
          opacity 150ms var(--ease-out);
      }

      .cancel-button {
        border: 1px solid var(--line);
        color: var(--ink-muted);
        background: var(--surface);
      }

      .cancel-button:hover {
        color: var(--ink);
        background: var(--surface-soft);
      }

      .send-button {
        color: #ffffff;
        background: var(--accent);
      }

      .send-button:hover:not(:disabled) {
        background: #255fd1;
      }

      .send-button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .status-bar {
        justify-content: center;
        gap: 8px;
        min-height: 28px;
        color: var(--ink-faint);
        font-size: 10px;
      }

      .status-bar .runtime-dot {
        width: 6px;
        height: 6px;
        box-shadow: none;
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 2;
        max-width: 320px;
        padding: 10px 13px;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.97);
        box-shadow: var(--shadow);
        font-size: 11px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 980px) {
        body {
          min-width: 720px;
        }

        .app-shell {
          grid-template-columns: 238px minmax(0, 1fr);
        }

        .conversation {
          padding-right: 32px;
          padding-left: 32px;
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .session-item,
        .icon-button,
        .new-task,
        .send-button,
        .cancel-button {
          -webkit-tap-highlight-color: transparent;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-sidebar" aria-label="项目与会话">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">⌁</div>
          <div>
            <div class="brand-name">Agent Workbench</div>
            <div class="brand-caption">Local-first workspace</div>
          </div>
        </div>

        <button class="workspace-row" id="workspaceButton" type="button" aria-label="切换工作区">
          <span>
            <span class="workspace-label" id="workspaceName">agent-workbench-app</span>
            <span class="workspace-branch" id="workspaceBranch">main · local</span>
          </span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        <button class="new-task" id="newTaskButton" type="button">
          <span class="plus" aria-hidden="true">＋</span>
          <span>New task</span>
        </button>

        <div class="sidebar-section-label">Projects & sessions</div>
        <nav class="session-list" id="sessionList" aria-label="项目会话列表"></nav>

        <div class="sidebar-footer">
          <span class="runtime-dot" aria-hidden="true"></span>
          <span class="runtime-label">
            <strong>Local runtime ready</strong>
            127.0.0.1 · loopback
          </span>
          <span class="profile" aria-label="当前用户 LS">LS</span>
        </div>
      </aside>

      <main class="main-panel">
        <header class="main-header">
          <div>
            <h1 class="header-title" id="conversationTitle">Shared API client</h1>
            <div class="header-subtitle" id="conversationSubtitle">
              agent-workbench-app · Task 16 · active now
            </div>
          </div>
          <div class="header-actions">
            <span class="status-chip">
              <span class="runtime-dot" aria-hidden="true"></span>
              Local connected
            </span>
            <button class="icon-button" id="shareButton" type="button" aria-label="分享预览">↗</button>
            <button class="icon-button" id="moreButton" type="button" aria-label="更多操作">···</button>
          </div>
        </header>

        <section class="conversation" id="conversation" aria-live="polite">
          <div class="conversation-inner">
            <div class="day-label" id="dayLabel">Today · Local session</div>
            <div id="messageList"></div>
          </div>
        </section>

        <div class="composer-wrap">
          <form class="composer" id="composer">
            <textarea
              id="draftInput"
              rows="2"
              aria-label="输入任务"
              placeholder="Describe a task for your local agent…"
            ></textarea>
            <div class="composer-toolbar">
              <span class="composer-hint">⌘ / Ctrl + Enter to send</span>
              <div class="composer-actions">
                <button class="cancel-button" id="cancelButton" type="button" hidden>Cancel run</button>
                <button class="send-button" id="sendButton" type="submit">Send</button>
              </div>
            </div>
          </form>
          <div class="status-bar">
            <span class="runtime-dot" aria-hidden="true"></span>
            <span id="runtimeStatus">Local runtime ready · No remote connections</span>
          </div>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (() => {
        const projects = [
          {
            id: "agent-workbench-app",
            name: "agent-workbench-app",
            branch: "main",
            tone: "blue",
            task: "Task 16",
            sessions: [
              { id: "shared-api", title: "Shared API client", meta: "Task 16 · 8 msgs" },
              { id: "desktop-lifecycle", title: "Desktop host lifecycle", meta: "Task 15 · 12 msgs" },
              { id: "runtime-boundaries", title: "Runtime boundaries", meta: "Task 7 · 16 msgs" }
            ]
          },
          {
            id: "research-notes",
            name: "research-notes",
            branch: "notes",
            tone: "green",
            task: "Research",
            sessions: [
              { id: "literature-map", title: "Literature map", meta: "6 sources · 5 msgs" },
              { id: "paper-outline", title: "Paper outline", meta: "Draft · 9 msgs" }
            ]
          }
        ];

        const conversationBySession = {
          "shared-api": {
            title: "Shared API client",
            subtitle: "agent-workbench-app · Task 16 · active now",
            user: "把 Local Agent API 的客户端边界共享给 CLI 和 Desktop，并保留取消与流式事件。",
            assistant:
              "已完成本地客户端边界的 MVP 接入。CLI 与 Desktop 现在可以复用同一组 Session、Turn 和事件流请求，桌面层不需要接触传输细节。",
            checks: [
              "Session 创建、查询和 Turn 流统一走 LocalAgentApiClient",
              "取消会透传 AbortSignal，并保留当前草稿",
              "Provider URL、credentialRef 与 tool input 不进入桌面 ViewModel"
            ]
          },
          "desktop-lifecycle": {
            title: "Desktop host lifecycle",
            subtitle: "agent-workbench-app · Task 15 · renderer preview",
            user: "检查桌面端启动、连接和取消任务时的交互状态。",
            assistant:
              "桌面端 MVP 已覆盖连接、发送、增量输出和取消后的状态恢复。下一步可以再加入更丰富的设置面板与空状态插画。",
            checks: [
              "连接状态集中显示在标题栏与底部状态栏",
              "运行中禁用重复发送，取消后恢复输入",
              "当前预览保持纯本地，不加载外部资源"
            ]
          },
          "runtime-boundaries": {
            title: "Runtime boundaries",
            subtitle: "agent-workbench-app · Task 7 · policy review",
            user: "回顾工具审批和 Agent Runtime 的安全边界。",
            assistant:
              "工具策略采用 fail-closed 设计。没有明确批准时不会执行工具，错误会折叠为固定文案，运行时也不会接触凭据或远程传输字段。",
            checks: [
              "deny 与未批准的 ask 分支都不会调用 executor",
              "policy、approval 和 executor 都收到取消信号",
              "工具结果仅用于下一轮模型请求，不进入 UI 事件"
            ]
          },
          "literature-map": {
            title: "Literature map",
            subtitle: "research-notes · Research · reading queue",
            user: "整理这周要继续阅读的论文方向。",
            assistant:
              "已按主题整理阅读队列：本地 Agent 架构、流式协议边界和人机协作审批。可以从架构综述开始，再回到实现细节。",
            checks: [
              "Local-first agent architecture",
              "Streaming protocol correctness",
              "Human approval boundaries"
            ]
          },
          "paper-outline": {
            title: "Paper outline",
            subtitle: "research-notes · Draft · working notes",
            user: "把当前研究笔记整理成一个简短提纲。",
            assistant:
              "当前提纲分为问题定义、系统边界、实验设计和局限性四部分。后续可以把 Task 结果整理为可复现的实验记录。",
            checks: [
              "问题定义与设计目标",
              "模块化实现和验证证据",
              "局限性与后续工作"
            ]
          }
        };

        const elements = {
          sessionList: document.querySelector("#sessionList"),
          workspaceButton: document.querySelector("#workspaceButton"),
          workspaceName: document.querySelector("#workspaceName"),
          workspaceBranch: document.querySelector("#workspaceBranch"),
          newTaskButton: document.querySelector("#newTaskButton"),
          title: document.querySelector("#conversationTitle"),
          subtitle: document.querySelector("#conversationSubtitle"),
          messageList: document.querySelector("#messageList"),
          conversation: document.querySelector("#conversation"),
          composer: document.querySelector("#composer"),
          draftInput: document.querySelector("#draftInput"),
          sendButton: document.querySelector("#sendButton"),
          cancelButton: document.querySelector("#cancelButton"),
          runtimeStatus: document.querySelector("#runtimeStatus"),
          shareButton: document.querySelector("#shareButton"),
          moreButton: document.querySelector("#moreButton"),
          toast: document.querySelector("#toast")
        };

        const state = {
          activeSessionId: "shared-api",
          busy: false,
          timer: null,
          toastTimer: null
        };

        const findSession = (id) => {
          for (const project of projects) {
            const session = project.sessions.find((item) => item.id === id);
            if (session) return { project, session };
          }
          return null;
        };

        const makeElement = (tag, className, text) => {
          const element = document.createElement(tag);
          if (className) element.className = className;
          if (text !== undefined) element.textContent = text;
          return element;
        };

        const showToast = (message) => {
          elements.toast.textContent = message;
          elements.toast.classList.add("visible");
          window.clearTimeout(state.toastTimer);
          state.toastTimer = window.setTimeout(() => {
            elements.toast.classList.remove("visible");
          }, 2400);
        };

        const renderSidebar = () => {
          elements.sessionList.replaceChildren();
          for (const project of projects) {
            const group = makeElement("section", "project-group");
            const heading = makeElement("div", "project-heading");
            const dot = makeElement("span", "project-dot" + (project.tone === "green" ? " green" : ""));
            dot.setAttribute("aria-hidden", "true");
            heading.append(dot);
            heading.append(makeElement("span", "project-name", project.name));
            heading.append(makeElement("span", "project-branch", project.branch));
            group.append(heading);

            for (const session of project.sessions) {
              const item = document.createElement("button");
              item.type = "button";
              item.className = "session-item" + (session.id === state.activeSessionId ? " active" : "");
              item.dataset.sessionId = session.id;
              item.setAttribute("aria-pressed", String(session.id === state.activeSessionId));
              const icon = makeElement("span", "session-icon", "◌");
              icon.setAttribute("aria-hidden", "true");
              const copy = makeElement("span");
              copy.append(makeElement("span", "session-title", session.title));
              copy.append(makeElement("span", "session-meta", session.meta));
              item.append(icon, copy);
              item.addEventListener("click", () => {
                if (state.busy || session.id === state.activeSessionId) return;
                state.activeSessionId = session.id;
                renderSidebar();
                renderConversation();
                showToast("已切换到 " + session.title);
              });
              group.append(item);
            }
            elements.sessionList.append(group);
          }
        };

        const addToolCard = (container) => {
          const details = document.createElement("details");
          details.className = "tool-card";
          const summary = makeElement("summary");
          summary.append(makeElement("span", "", "Check local boundary"));
          summary.append(makeElement("span", "tool-status", "completed"));
          details.append(summary);
          const rows = makeElement("div", "tool-rows");
          const values = [
            ["Target", "Local Agent API"],
            ["Transport", "loopback only"],
            ["Result", "boundary looks good"]
          ];
          for (const [label, value] of values) {
            const row = makeElement("div", "tool-row");
            row.append(makeElement("span", "", label));
            row.append(makeElement("strong", "", value));
            rows.append(row);
          }
          details.append(rows);
          container.append(details);
        };

        const addMessage = ({ role, body, checks, tool, time }) => {
          const message = makeElement("article", "message " + role);
          const avatar = makeElement("div", "message-avatar", role === "user" ? "You" : "A");
          avatar.setAttribute("aria-hidden", "true");
          const content = makeElement("div");
          const heading = makeElement("div", "message-heading");
          heading.append(makeElement("span", "message-author", role === "user" ? "You" : "Agent"));
          heading.append(makeElement("span", "message-time", time || "just now"));
          content.append(heading);
          const bodyElement = makeElement("div", "message-body");
          bodyElement.append(makeElement("p", "", body));
          if (checks && checks.length) {
            const list = makeElement("ul", "check-list");
            for (const checkText of checks) {
              const li = document.createElement("li");
              li.append(makeElement("span", "check", "✓"));
              li.append(makeElement("span", "", checkText));
              list.append(li);
            }
            bodyElement.append(list);
          }
          if (tool) addToolCard(bodyElement);
          content.append(bodyElement);
          message.append(avatar, content);
          elements.messageList.append(message);
          return message;
        };

        const renderConversation = () => {
          const selected = findSession(state.activeSessionId);
          const conversation = conversationBySession[state.activeSessionId];
          if (!selected || !conversation) return;
          elements.title.textContent = conversation.title;
          elements.subtitle.textContent = conversation.subtitle;
          elements.workspaceName.textContent = selected.project.name;
          elements.workspaceBranch.textContent = selected.project.branch + " · local";
          elements.messageList.replaceChildren();
          addMessage({
            role: "user",
            body: conversation.user,
            time: "10:42"
          });
          addMessage({
            role: "assistant",
            body: conversation.assistant,
            checks: conversation.checks,
            tool: true,
            time: "10:43"
          });
          elements.conversation.scrollTop = elements.conversation.scrollHeight;
        };

        const setBusy = (busy) => {
          state.busy = busy;
          elements.sendButton.disabled = busy;
          elements.cancelButton.hidden = !busy;
          elements.draftInput.disabled = false;
          elements.runtimeStatus.textContent = busy
            ? "Local runtime running · streaming events"
            : "Local runtime ready · No remote connections";
          for (const item of elements.sessionList.querySelectorAll(".session-item")) {
            item.disabled = busy;
          }
        };

        const submitDraft = () => {
          if (state.busy) return;
          const draft = elements.draftInput.value.trim();
          if (!draft) {
            showToast("先输入一个任务，再发送。");
            elements.draftInput.focus();
            return;
          }

          const selected = findSession(state.activeSessionId);
          const userMessage = addMessage({ role: "user", body: draft, time: "now" });
          const agentMessage = addMessage({
            role: "assistant",
            body: "正在连接本地运行时…",
            time: "streaming"
          });
          const bodyElement = agentMessage.querySelector(".message-body p");
          const chunks = [
            "正在连接本地运行时…",
            "已接收任务，开始流式处理。",
            "MVP 演示完成：项目与 Session 状态保持在当前工作区内。"
          ];
          let index = 0;
          elements.draftInput.value = "";
          elements.conversation.scrollTop = elements.conversation.scrollHeight;
          setBusy(true);
          showToast("已发送到 " + (selected ? selected.project.name : "当前项目"));

          state.timer = window.setInterval(() => {
            index += 1;
            bodyElement.textContent = chunks[index] || chunks[chunks.length - 1];
            elements.conversation.scrollTop = elements.conversation.scrollHeight;
            if (index >= chunks.length - 1) {
              window.clearInterval(state.timer);
              state.timer = null;
              setBusy(false);
              agentMessage.querySelector(".message-time").textContent = "just now";
            }
          }, 700);
          void userMessage;
        };

        const cancelRun = () => {
          if (!state.busy) return;
          window.clearInterval(state.timer);
          state.timer = null;
          const latest = elements.messageList.lastElementChild;
          const body = latest && latest.querySelector(".message-body p");
          const time = latest && latest.querySelector(".message-time");
          if (body) body.textContent = "本轮运行已取消。已保留当前上下文，你可以继续编辑后再次发送。";
          if (time) time.textContent = "cancelled";
          elements.draftInput.value = "继续完善这个边界";
          setBusy(false);
          showToast("运行已取消，草稿已保留。");
          elements.draftInput.focus();
        };

        elements.composer.addEventListener("submit", (event) => {
          event.preventDefault();
          submitDraft();
        });

        elements.draftInput.addEventListener("keydown", (event) => {
          if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
            event.preventDefault();
            submitDraft();
          }
        });

        elements.cancelButton.addEventListener("click", cancelRun);
        elements.newTaskButton.addEventListener("click", () => {
          if (state.busy) return;
          state.activeSessionId = "shared-api";
          renderSidebar();
          renderConversation();
          elements.draftInput.value = "";
          elements.draftInput.focus();
          showToast("已准备一个新的本地任务。");
        });
        elements.workspaceButton.addEventListener("click", () => {
          showToast("工作区切换器将在后续 MVP 迭代中接入。");
        });
        elements.shareButton.addEventListener("click", () => {
          showToast("预览模式：分享链接功能待接入。");
        });
        elements.moreButton.addEventListener("click", () => {
          showToast("更多操作将在后续小组件迭代中加入。");
        });

        renderSidebar();
        renderConversation();
      })();
    </script>
  </body>
</html>
